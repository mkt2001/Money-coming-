name: Build Android APK and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Works whether you uploaded the extracted project OR the raw .zip file.
      - name: Find or extract Godot project
        id: proj
        shell: bash
        run: |
          find_proj() { find . -name project.godot -not -path "./.git/*" -not -path "*/.godot/*" | head -n 1; }
          P="$(find_proj)"
          if [ -z "$P" ]; then
            echo "project.godot not found - looking for zip files..."
            mkdir -p _extracted
            find . -iname "*.zip" -not -path "./.git/*" -not -path "./_extracted/*" > zips.txt
            cat zips.txt
            while read -r z; do
              echo "Extracting $z"
              unzip -o -q "$z" -d _extracted || true
            done < zips.txt
            P="$(find_proj)"
          fi
          if [ -z "$P" ]; then
            echo "ERROR: project.godot not found in repo or in any zip"
            exit 1
          fi
          DIR="$(dirname "$P")"
          echo "Godot project directory: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Setup Android SDK
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f | head -n 1)"; fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Configure Godot for Android (debug keystore)
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.3.tres editor_settings-4.tres; do
          cat > "$HOME/.config/godot/$f" << SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          done
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.3.tres" "$HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Import project
        shell: bash
        run: |
          godot --headless --path "${{ steps.proj.outputs.dir }}" --import || true
          godot --headless --path "${{ steps.proj.outputs.dir }}" --import || true

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --verbose --path "${{ steps.proj.outputs.dir }}" --export-debug "Android" "$GITHUB_WORKSPACE/build/MoneyComing.apk"
          ls -la "$GITHUB_WORKSPACE/build"
          test -s "$GITHUB_WORKSPACE/build/MoneyComing.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyComing-APK
          path: build/MoneyComing.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Money Coming v${{ github.run_number }}
          body: "Money Coming - debug APK (install on Android 10+)."
          files: build/MoneyComing.apk
          make_latest: true
