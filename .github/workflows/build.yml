name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip uploaded zip files and find the Gradle project
        run: |
          UNZ="$RUNNER_TEMP/unzipped"
          mkdir -p "$UNZ"
          # unzip every .zip found in the repo (and zips inside those zips)
          for round in 1 2; do
            find . "$UNZ" -iname '*.zip' -not -path './.git/*' -print0 | while IFS= read -r -d '' Z; do
              [ -f "$Z.done" ] && continue
              echo "Unzipping $Z"
              unzip -q -o "$Z" -d "$UNZ/$(basename "$Z" .zip)_$round" || true
              touch "$Z.done" 2>/dev/null || true
            done
          done
          F=$(find . "$UNZ" -name settings.gradle.kts -not -path './.git/*' -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "ERROR: settings.gradle.kts not found (neither in the repo nor inside any zip). Files:"
            find . "$UNZ" -maxdepth 4 -not -path './.git/*' | head -n 100
            exit 1
          fi
          DIR=$(cd "$(dirname "$F")" && pwd)
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9 (installs dependencies, caches them)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # If you add the 4 secrets below (see README) the release APK is signed with YOUR key.
      # Without them a throw-away key is generated so the APK still installs.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using signing key from repository secrets"
          else
            PASS="$(openssl rand -hex 12)"
            keytool -genkeypair -alias moneycoming -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore "$KS" -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Money Coming, OU=Game, O=MoneyComing, C=IN"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=moneycoming" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "No secrets configured: generated a temporary signing key"
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" assembleDebug assembleRelease --console=plain 2>&1 | tee build.log

      - name: Show build errors (short)
        if: failure()
        run: |
          {
            echo "## Build errors (screenshot this)"
            echo '```'
            grep -E "^e: " build.log | sed 's#file://##' | head -40 || true
            grep -A8 "What went wrong" build.log | head -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: " build.log | head -40 || true

      - name: Collect APKs
        run: |
          mkdir -p out
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "out/MoneyComing-v${APP_VERSION_NAME}-debug.apk"
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "out/MoneyComing-v${APP_VERSION_NAME}-release.apk"
          ls -lh out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoneyComing-APKs
          path: out/*.apk

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports

      - name: Publish GitHub Release with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Money Coming v${{ env.APP_VERSION_NAME }}
          body: |
            Money Coming - virtual-coin slot game (no real money).
            Download **MoneyComing-v${{ env.APP_VERSION_NAME }}-release.apk**, open it on your Android phone and install
            (allow "Install unknown apps" for your browser/file manager if asked).
          files: out/*.apk
          fail_on_unmatched_files: true
